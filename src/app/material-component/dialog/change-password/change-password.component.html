<mat-toolbar color="primary" class="signup-toolbar">
    <mat-toolbar-row>
        <span>Change Password</span>
        <span class="spacer"></span>
        <button class="mat-dialog-close" mat-icon-button mat-dialog-close aria-label="Close">
            <mat-icon>close</mat-icon>
        </button>
    </mat-toolbar-row>
</mat-toolbar>

<mat-dialog-content>
    <form [formGroup]="changePasswordForm">
        <div fxFlex fxLayout="column">
            <mat-form-field appearance="fill" fxFlex>
                <mat-label>Old Password</mat-label>
                <input matInput type="password" formControlName="oldPassword" placeholder="Enter your old password"
                    required [type]="oldPassword ? 'password' : 'text'">
                <button type="button" mat-icon-button matSuffix (click)="oldPassword = !oldPassword"
                    [attr.aria-label]="'Hide password'" [attr.aria-pressed]="oldPassword">
                    <mat-icon style="color: black;">{{oldPassword ? 'visibility_off' :
                        'visibility'}}</mat-icon></button>
                <mat-error
                    *ngIf="changePasswordForm.controls['oldPassword'].touched && changePasswordForm.controls['oldPassword'].invalid">
                    <span *ngIf="changePasswordForm.controls['oldPassword']?.errors?.['required']">This field is
                        mandatory.</span>

                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" fxFlex>
                <mat-label>New Password</mat-label>
                <input matInput type="password" formControlName="newPassword" placeholder="Enter your new password"
                    required [type]="newPassword ? 'password' : 'text'">
                <button type="button" mat-icon-button matSuffix (click)="newPassword = !newPassword"
                    [attr.aria-label]="'Hide password'" [attr.aria-pressed]="newPassword">
                    <mat-icon style="color: black;">{{newPassword ? 'visibility_off' :
                        'visibility'}}</mat-icon></button>
                <mat-error
                    *ngIf="changePasswordForm.controls['newPassword'].touched && changePasswordForm.controls['newPassword'].invalid">
                    <span *ngIf="changePasswordForm.controls['newPassword']?.errors?.['required']">This field is
                        mandatory.</span>
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="fill" fxFlex>
                <mat-label>Confirm Password</mat-label>
                <input matInput type="password" formControlName="confirmPassword"
                    placeholder="Enter your confirm password" required [type]="confirmPassword ? 'password' : 'text'">
                <button type="button" mat-icon-button matSuffix (click)="confirmPassword = !confirmPassword"
                    [attr.aria-label]="'Hide password'" [attr.aria-pressed]="confirmPassword">
                    <mat-icon style="color: black;">{{confirmPassword ? 'visibility_off' :
                        'visibility'}}</mat-icon></button>
                <mat-error
                    *ngIf="changePasswordForm.controls['confirmPassword'].touched && changePasswordForm.controls['confirmPassword'].invalid">
                    <span *ngIf="changePasswordForm.controls['confirmPassword']?.errors?.['required']">This field is
                        mandatory.</span>
                </mat-error>
                <mat-hint *ngIf="validateSubmit() && !(changePasswordForm.controls['confirmPassword'].invalid)">
                    <span>New Password & Old Password does not match.</span>
                </mat-hint>
            </mat-form-field>

        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" type="submit" (click)="handlepasswordChangeSubmit()"
        [disabled]="validateSubmit() || !(changePasswordForm.valid && changePasswordForm.dirty)">
        <mat-icon>save</mat-icon> Update
    </button>
    <button mat-raised-button color="warn" mat-dialog-close>
        <mat-icon>cancel</mat-icon> Close
    </button>
</mat-dialog-actions>
