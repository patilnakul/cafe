<mat-nav-list appAccordion>
  <mat-list-item 
    appAccordionLink 
    *ngFor="let menuItem of menuItems.getMenuitem()" 
    routerLinkActive="selected" 
    group="menuItem.state">
    
    <a 
      appAccordionToggle 
      [routerLink]="['/cafe/', menuItem.state]" 
      *ngIf="menuItem.type === 'link' && (menuItem.role === '' || menuItem.role === userRole)" style="color: #fff;">
      
      <mat-icon>{{ menuItem.icon }}</mat-icon>
      <span>{{ menuItem.name }}</span>
      
    </a>
  </mat-list-item>
</mat-nav-list>

<style>
    /* Base sidebar styles */
mat-nav-list {
  /* width: 250px; */
  /* min-height: 100vh; */
  /* background-color: #1e1e2f; */
  color: #ffffff;
  padding-top: 20px;
  transition: all 0.3s ease-in-out;
}

mat-list-item {
  display: flex;
  align-items: center;
    background-color: #1e1e2f;
  color: #ffffff;

  padding: 12px 20px;
  transition: background 0.3s ease;
}

mat-list-item:hover {
  background-color: #2c2c3e;
  cursor: pointer;
  color:#fff
}

mat-list-item a {
  display: flex;
  align-items: center;
  /* width: 100%; */
  color: inherit;
  text-decoration: none;
}

mat-list-item a.selected {
  background-color: #3f51b5;
  color: #fff;
  border-radius: 4px;
}

mat-icon {
  margin-right: 10px;
}

/* Responsive design */
@media (max-width: 768px) {
  mat-nav-list {
    /* width: 100%; */
    /* min-height: auto; */
    padding: 10px;
  }

  mat-list-item {
    justify-content: center;
    padding: 10px;
  }

  mat-list-item span {
    display: none; /* hide text on small screens */
  }

  mat-icon {
    margin-right: 0;
  }
}

@media (min-width: 769px) and (max-width: 1024px) {
  /* mat-nav-list {
    width: 200px;
  } */
}

</style>
