
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
   
/* ================================
   Base Layout Styles
================================== */

.main-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

.logo {
  margin-right: auto;
  font-family: 'Pacifico', cursive;
font-size: 1.3rem;
  

}
mat-toolbar.topbar {
  display: flex;
  align-items: center;
  height: 64px;
  z-index: 10;
  position: sticky;
  top: 0;
  background-color: #181e21; /* fallback if color="primary" fails */
  color: white;
  padding: 0 16px;
  gap: 30.5em;
}

.navbar-header {
  display: flex;
  align-items: center;
  gap: 8px;
}

.navbar-header mat-icon {
  vertical-align: middle;
}

.example-sidenav-container {
  flex-grow: 1;
  display: flex;
  height: calc(100vh - 64px);
}

mat-sidenav {
  width: 240px;
  background-color: #ffffff;
  box-shadow: 1px 0px 20px rgba(0, 0, 0, 0.08);
  overflow-y: auto;
}

mat-sidenav-content.page-wrapper {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  background: #f5f5f5;
  height: 100%;
}

.page-content {
  padding: 15px;
  overflow-y: auto;
  height: 100%;
}

/* ================================
   Sidebar Responsive Behavior
================================== */

@media (max-width: 1024px) {
  mat-sidenav {
    width: 220px;
  }

  mat-sidenav-content.page-wrapper {
    margin-left: 0 !important;
  }

  .main-container {
    flex-direction: column;
  }

  .navbar-header span {
    display: none;
  }

  .page-content {
    padding: 10px;
  }
}

@media (max-width: 767px) {
  mat-toolbar.topbar {
    height: 56px;
    flex-wrap: wrap;
  }

  .navbar-header {
    flex: 1 1 auto;
  }

  .topbar .mat-icon-button {
    margin-right: 8px;
  }

  mat-sidenav {
    position: fixed;
    height: 100%;
    z-index: 1000;
  }

  .example-sidenav-container {
    flex-direction: column;
    height: calc(100vh - 56px);
  }

  mat-sidenav-content.page-wrapper {
    height: 100%;
  }
}

/* ================================
   Flex Utilities (Optional)
================================== */

.d-flex {
  display: flex;
}

.no-block {
  display: flex;
}

.align-items-center {
  align-items: center;
}


</style>
  

<div class="main-container">
    <mat-toolbar color="primary" class="topbar telative">
        <div class="navbar-header">
            <button mat-icon-button (click)="snav.toggle()" value="sidebarclosed" style="vertical-align: bottom;">
                <mat-icon>menu</mat-icon>
            </button><b>
                <span style="vertical-align: middle;">
                    <mat-icon>storefront</mat-icon>
                </span>
            </b>
            <span fxShow="false" class="logo" fxShow.gt-xs>
                Cafe FlavourHut
            </span>
        </div>
        <span fxFlex></span>
        <app-header></app-header>
    </mat-toolbar>
    <mat-sidenav-container class="example-sidenav-container" [style.marginTop.px]="mobileQuery.matches ? 0 : 0">
        <mat-sidenav #snav id="snav" class="dark-sidebar pl-xs" [mode]="mobileQuery.matches ? 'side' : 'over'"
            fixedTopGap="0" [opened]="mobileQuery.matches" [disableClose]="mobileQuery.matches">
            <app-sidebar></app-sidebar>
        </mat-sidenav>
        <mat-sidenav-content class="page-wrapper">
            <div class="page-content">
                <router-outlet></router-outlet>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
