<!-- Inside your navbar or mat-toolbar -->
<span class="spacer"></span>

<div class="profile-container">
    <button [matMenuTriggerFor]="profile" mat-icon-button class="profile-icon-btn">
        <mat-icon>account_circle</mat-icon>
    </button>

    <mat-menu #profile="matMenu" class="mymegamenu">
        <button mat-menu-item>
            <mat-icon>person</mat-icon>
            <span>My Profile</span>
        </button>
        <button mat-menu-item>
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
        </button>
        <div class="menu-divider"></div>
        <button mat-menu-item>
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
        </button>
    </mat-menu>
</div>







<style>
    /* Spacer to push content to the right */
    
    .spacer {
        flex: 1 1 auto;
    }

    /* Profile container */
    .profile-container {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        margin-right: 16px;
    }

    /* Icon button style */
    .profile-icon-btn {
        color: #fff;
        background: transparent;
        border-radius: 50%;
        transition: background 0.3s ease;
    }

    .profile-icon-btn:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    /* Mat menu styling */
    .mymegamenu {
        padding: 0;
        min-width: 200px;
        border-radius: 6px;
        background-color: #ffffff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        font-size: 14px;
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 0.25s ease, transform 0.25s ease;
        animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: scale(0.95);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Menu item styles */
    .mymegamenu .mat-menu-item {
        padding: 10px 16px;
        display: flex;
        align-items: center;
        transition: background 0.2s ease;
    }

    .mymegamenu .mat-menu-item:hover {
        background-color: #f0f0f0;
    }

    .mymegamenu .mat-menu-item mat-icon {
        margin-right: 10px;
        color: #555;
    }

    /* Divider */
    .menu-divider {
        height: 1px;
        background-color: #ddd;
        margin: 4px 0;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .mymegamenu {
            min-width: 160px;
            font-size: 13px;
        }

        .profile-container {
            margin-right: 8px;
        }

        .mymegamenu .mat-menu-item {
            padding: 8px 12px;
        }

        .mymegamenu .mat-menu-item mat-icon {
            font-size: 18px;
            margin-right: 8px;
        }
    }
</style>

<!-- Bootstrap 5 JS (optional, for dropdowns, modals, etc.) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
